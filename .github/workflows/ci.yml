name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run pyright
      - name: Build release wheel
        run: uv build --wheel
      - name: Test installed wheel outside the checkout
        env:
          AUTOLAB_WHEEL_DIR: dist
        run: uv run pytest -q tests/integration/test_wheel_install.py
