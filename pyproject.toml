[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autonomous-lab"
version = "0.1.0"
description = "A reproducible, hardware-agnostic autonomous experimental discovery platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AutoLab contributors" }]
dependencies = [
  "alembic>=1.14,<2",
  "numpy>=2.1,<3",
  "optuna>=4.5,<5",
  "pint>=0.24,<1",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.14,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
bayesian = ["torch>=2.5,<3"]
dev = [
  "hypothesis>=6.120,<7",
  "pyright>=1.1.390,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
autolab = "autonomous_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autonomous_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["slow: longer-running statistical or optimisation benchmark"]

[tool.coverage.run]
branch = true
source = ["autonomous_lab"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
exclude = ["migrations", "data"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = "warning"
