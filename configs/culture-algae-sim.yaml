# Culture campaign (contract v2): tune temperature, light and pH for a simulated
# algae photobioreactor, maximising end-point OD750 while minimising energy and CO2.
# pH is a setpoint the device holds by dosing CO2; CO2 used is measured.
#
# Requires an installed controller adapter named "algae-sim-reactor" (provided by
# the separate algae-sim project) that integrates its own OD750 probe. The growth
# model behind it is illustrative and unvalidated; results are not predictions.
schema_version: "1"
experiment_type: culture

campaign:
  name: algae_sim_light_temperature
  seed: 7
  max_experiments: 20

objective:
  metrics:
    - name: final_od750
      direction: maximize
      unit: dimensionless
    - name: energy_kwh
      direction: minimize
      unit: kilowatt_hour
    - name: co2_g
      direction: minimize
      unit: gram

parameter_space:
  temperature:
    kind: continuous
    unit: degC
    minimum: 20
    maximum: 34
    resolution: 0.1
  light_intensity:
    kind: continuous
    unit: micromole / meter ** 2 / second
    minimum: 30
    maximum: 400
    resolution: 1
  ph:
    kind: continuous
    unit: dimensionless
    minimum: 6.5
    maximum: 8.5
    resolution: 0.05

culture_design:
  # Three biological replicates; at least two must pass QC for the run to count.
  reactor_ids: [reactor-1, reactor-2, reactor-3]
  minimum_passing_replicates: 2
  duration: {value: 36, unit: hour}
  sampling_interval: {value: 6, unit: hour}
  sample_tolerance: {value: 10, unit: minute}
  telemetry_interval: {value: 15, unit: minute}

culture_qc:
  # Per-variable warm-up before tracking is scored (pH settles more slowly).
  tracking_warmups:
    temperature: {value: 3, unit: hour}
    ph: {value: 3, unit: hour}
  # Mean |measured - setpoint| allowed after warm-up, per tracked variable.
  tracking_tolerances:
    temperature: 1.0
    ph: 0.2
  minimum_telemetry_coverage: 0.9
  maximum_missing_reading_fraction: 0.2
  require_final_reading: true
  # Illustrative contamination screens (not validated for any organism).
  maximum_od_drop: 0.05
  maximum_specific_growth_rate_per_hour: 0.5

execution:
  controller:
    adapter: algae-sim-reactor
    controller_id: algae-sim-ctrl-001
  clock: simulated
  on_interrupt: safe_state

optimization:
  strategy: bayesian
  startup_experiments: 8
