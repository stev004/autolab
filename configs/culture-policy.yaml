# Trusted installation policy for culture experiments (stage 6).
# Campaign documents cannot widen these limits. Values are illustrative for a
# small simulated photobioreactor, not validated for any real organism or device.
schema_version: "1"
policy_name: culture_policy_simulated_photobioreactor
policy_version: "1"
temperature_setpoint_range:
  minimum: {value: 18, unit: degree_Celsius}
  maximum: {value: 36, unit: degree_Celsius}
  resolution: {value: 0.1, unit: delta_degree_Celsius}
light_intensity_range:
  minimum: {value: 0, unit: micromole / meter ** 2 / second}
  maximum: {value: 500, unit: micromole / meter ** 2 / second}
  resolution: {value: 1, unit: micromole / meter ** 2 / second}
maximum_duration: {value: 72, unit: hour}
minimum_sampling_interval: {value: 30, unit: minute}
maximum_sample_points: 200
minimum_trip_margin: {value: 2, unit: delta_degree_Celsius}
trusted_compilers: ["culture_hold_compiler@1.0.0"]
